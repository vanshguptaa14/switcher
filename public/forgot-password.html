<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset System Access</title>
    <style>
        :root {
            --neon-green: #39ff14;
            --dark-bg: #0a0a0a;
            --gradient: linear-gradient(135deg, #0a0a0a 0%, #1a2e1a 100%);
            --card-bg: rgba(20, 20, 20, 0.9);
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: var(--gradient);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(57, 255, 20, 0.2);
            width: 100%;
            max-width: 380px;
            border: 1px solid rgba(57, 255, 20, 0.3);
            text-align: center;
        }

        h2 { 
            color: var(--neon-green); 
            text-transform: uppercase; 
            letter-spacing: 2px;
            margin-bottom: 1.5rem;
        }

        p {
            font-size: 0.9rem;
            color: #888;
            margin-bottom: 1rem;
        }
        
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #111;
            border: 1px solid #333;
            border-radius: 8px;
            color: var(--neon-green);
            box-sizing: border-box;
            transition: 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--neon-green);
            box-shadow: 0 0 10px rgba(57, 255, 20, 0.5);
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            transition: 0.3s;
            border: none;
        }

        .btn-primary { 
            background: transparent; 
            color: var(--neon-green); 
            border: 2px solid var(--neon-green);
        }
        
        .btn-primary:hover { 
            background: var(--neon-green); 
            color: black; 
        }
        
        .btn-success { 
            background: var(--neon-green); 
            color: black; 
            box-shadow: 0 0 15px var(--neon-green);
        }
        
        .btn-success:hover { 
            box-shadow: 0 0 25px var(--neon-green);
            transform: translateY(-2px);
        }

        .hidden { display: none; }
        
        .message {
            font-size: 0.85rem;
            margin-top: 15px;
            font-weight: bold;
        }
        
        .link {
            display: block;
            margin-top: 20px;
            color: #666;
            text-decoration: none;
            font-size: 0.8rem;
            transition: 0.3s;
        }

        .link:hover {
            color: var(--neon-green);
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Reset Access</h2>
    
    <!-- Step 1: Enter Email -->
    <div id="step1">
        <p>Verify identity via registered email.</p>
        <input type="email" id="email" placeholder="System Email" required>
        <button class="btn-primary" onclick="requestOTP()">Request OTP</button>
    </div>

    <!-- Step 2: Enter OTP and New Password -->
    <div id="step2" class="hidden">
        <p>Enter decryption code and new credentials.</p>
        <input type="text" id="otp" placeholder="6-Digit OTP">
        <input type="password" id="newPassword" placeholder="New Password">
        <input type="password" id="confirmPassword" placeholder="Confirm Password">
        <button class="btn-success" onclick="resetPassword()">Rewrite Data</button>
    </div>

    <p id="msg" class="message"></p>
    <a href="login.html" class="link">Return to Login</a>
</div>

<script>
    const msg = document.getElementById('msg');

    async function requestOTP() {
        const email = document.getElementById('email').value;
        if (!email) return alert("Email required for verification.");

        msg.style.color = "white";
        msg.innerText = "Transmitting OTP request...";
        
        try {
            const response = await fetch('/send-otp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            });

            const data = await response.json();

            if (response.ok) {
                document.getElementById('step1').classList.add('hidden');
                document.getElementById('step2').classList.remove('hidden');
                msg.style.color = "var(--neon-green)";
                msg.innerText = "OTP RECEIVED SUCCESSFULLY";
            } else {
                msg.style.color = "#ff3131";
                msg.innerText = data.message || "VERIFICATION FAILED";
            }
        } catch (err) {
            msg.innerText = "NETWORK ERROR";
        }
    }

    async function resetPassword() {
        const email = document.getElementById('email').value;
        const otp = document.getElementById('otp').value;
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (newPassword !== confirmPassword) {
            return alert("Credential mismatch!");
        }

        try {
            const response = await fetch('/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, otp, newPassword })
            });

            if (response.ok) {
                alert("SYSTEM RECONFIGURED SUCCESSFULLY");
                window.location.href = 'login.html';
            } else {
                const data = await response.json();
                msg.style.color = "#ff3131";
                msg.innerText = data.message || "INVALID DECRYPTION CODE";
            }
        } catch (err) {
            msg.innerText = "CONNECTION INTERRUPTED";
        }
    }
</script>

</body>
</html>
